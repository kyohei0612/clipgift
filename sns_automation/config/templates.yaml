# SNS 投稿テンプレート（自動投稿システム用）
#
# 構造:
#   templates:
#     <platform>:
#       <category>:
#         - id: 一意の識別子（履歴記録用）
#           text: 投稿本文（{{変数}} で動的部分を表現）
#           weight: 重み（高いほど選ばれやすい、デフォルト 1.0）
#
# 出典: .company/marketing/sns/{x,threads,bluesky}-templates.md
# 更新時は元 markdown も同期すること。
#
# NG ワード厳守: 未経験 / 初心者向け / 教材 / 事務所名 / 具体配信者名

templates:
  # ============================================================
  # X (Twitter) - 短く強く、データドリブン、バズ狙い
  # ============================================================
  x:
    note_announce:
      - id: x-A-1
        weight: 1.0
        text: |
          【note 公開】
          {{title}}

          {{summary}}

          ▼続きはこちらから
          {{url}}

          #切り抜き #VTuber切り抜き #副業
      - id: x-A-2
        weight: 1.0
        text: |
          {{question}}

          私自身、最初はそうでした。
          {{hint}}

          詳しくは note にまとめました ▼
          {{url}}

          #切り抜き
      - id: x-A-3
        weight: 0.8
        text: |
          切り抜き作業、こんなことで疲れてませんか？

          ・配信を最初から見るのが地獄
          ・コメントの盛り上がり判定が手作業
          ・編集ソフトでスクラブ無限ループ

          私もそうでした。{{hint}}

          ▼ note でまとめました
          {{url}}

    daily:
      - id: x-B-1
        weight: 1.0
        text: |
          切り抜き師あるあるシリーズ

          「あ、ここ盛り上がってる」
          ↓
          タイムスタンプメモる
          ↓
          切り出した後、5 秒前から欲しいことに気づく
          ↓
          やり直し

          経験ある人 RT
      - id: x-B-2
        weight: 1.0
        text: |
          最近の VTuber 切り抜き、コメント流しがほぼマストになってますね。

          リアタイ感を演出する手法として完全定着。
          これがあるかないかで、視聴者の印象が変わる。

          切り抜き界隈は確実に「効率化フェーズ」に入ってます。
      - id: x-B-3
        weight: 1.0
        text: |
          2 年前、配信を見るのが好きなだけの自分が、
          切り抜きで稼ぐことになるとは思わなかった。

          きっかけは「誰かが切り抜きにしてないあのシーンを、自分が…」って気持ち。

          それだけで人生変わるよ。配信視聴者ほど、切り抜き師に向いてる。

    achievement:
      - id: x-C-1
        weight: 1.0
        text: |
          切り抜きツールを自作した結果：

          ✅ 最短 2 ヶ月で 1k 登録達成
          ✅ 2 ch 収益化通過
          ✅ 妻も同じツールで切り抜き作成中

          「家族で複数人が実証したツール」
          そろそろ皆さんにも公開します。
      - id: x-C-2
        weight: 1.0
        text: |
          コメント流し切り抜きを毎日 2-3 本作ってた頃、
          1 本に 30 分かかってた作業を 5 分に短縮するツールを自作した。

          その結果、最短 2 ヶ月で 1k 登録に到達。

          ツール、近日 BOOTH で公開予定。

    teaser:
      - id: x-D-1
        weight: 1.0
        text: |
          近日、自作の切り抜きツールを公開します。

          VTuber 切り抜きで実証済み。
          「画面録画疲れた」を解決します。

          詳細は近日 note で。
      - id: x-D-2
        weight: 1.0
        text: |
          切り抜き作業の 30 分 → 5 分。
          コメント流し切り抜きを、ツール 1 つで完結。

          来週、BOOTH で公開予定です。

          ▼ 詳細は note 連載で
          {{url}}
      - id: x-D-3
        weight: 1.0
        text: |
          本日、クリップギフト公開。

          BOOTH で 3 プラン展開:
          ・ライト 1,980 円
          ・スタンダード 4,980 円 → 早期割 2,980 円（〜6/30）
          ・拡張無料版 9,800 円

          ▼ BOOTH
          {{booth_url}}

          ▼ 詳細
          {{url}}

    launch:
      - id: x-E-1
        weight: 1.0
        text: |
          クリップギフト スタンダード版、早期割は 6/30 まで。

          通常 4,980 円 → 2,980 円（40% off）

          7/1 から正式販売価格に戻ります。
          迷ってる方はお早めに ▼

          {{booth_url}}
      - id: x-E-2
        weight: 0.8
        text: |
          よく頂く質問:

          Q. macOS 対応は？
          A. ありません、Windows 専用です

          Q. コメント少ない配信でも使える？
          A. 効果薄になります。コメント多い配信向けです

          Q. 1 年後どうなる？
          A. スタンダードは再購入か拡張無料版へ。永続が良ければ拡張無料版を
      - id: x-E-3
        weight: 1.0
        text: |
          切り抜き師の月 30 本作成として：

          従来: 1 本 30 分 → 月 15 時間
          クリップギフト: 1 本 5 分 → 月 2.5 時間

          節約: 月 12.5 時間 = 約 12,500 円分の価値

          スタンダード版（早期割 2,980 円）なら、1 週間で完全回収。

  # ============================================================
  # Threads - 柔らかく、共感ベース、ストーリー寄り
  # ============================================================
  threads:
    note_announce:
      - id: threads-A-1
        weight: 1.0
        text: |
          note 公開しました 📝

          {{title}}

          {{summary}}

          読みに来てもらえると嬉しいです 🙏
          {{url}}
      - id: threads-A-2
        weight: 1.0
        text: |
          切り抜き作業、こんな経験ありませんか？

          ・配信を最初から見るの、地味に消耗する
          ・盛り上がりシーンを探すだけで疲れる
          ・編集前にすでに脳が疲れてる

          私もそうでした。
          今日の note でこの話を書きました ▼
          {{url}}

    daily:
      - id: threads-B-1
        weight: 1.0
        text: |
          配信視聴者だった頃の自分に伝えたい：

          「あなたはこれから、自分が好きな配信を切り抜きにして、
          それで月数万円稼ぐ人になります」

          って。

          きっかけは小さなツールひとつでした。
      - id: threads-B-2
        weight: 1.0
        text: |
          最近、切り抜き界隈で「コメント流し」が標準になりましたね。

          リアタイの空気を、後から見る人にも届けたい。
          そんな手法が、今や当たり前に。

          切り抜きの世界、いい方向に進化してると思います。
      - id: threads-B-3
        weight: 1.0
        text: |
          妻も切り抜きを始めました。

          ツール使ってもらって、
          「これなら自分にもできるかも」って言われたとき、
          作って良かったって思った。

          家族で複数人使えるツール、ちゃんと作れた。

    achievement:
      - id: threads-C-1
        weight: 1.0
        text: |
          2 年前の自分は、ただの配信視聴者でした。

          今は、切り抜きで月数万円稼いでます。
          きっかけは、自分が見たかった切り抜きを、自分で作ろうと思ったこと。

          それだけ。

    teaser:
      - id: threads-D-1
        weight: 1.0
        text: |
          切り抜き作業の "面倒" を、全部自分でリスト化してみたら、
          30 個以上ありました。

          その全部をツールで肩代わりさせたい。
          そう思って、自作のツールを作ってます。

          近日公開予定 ✨
      - id: threads-D-2
        weight: 1.0
        text: |
          クリップギフト、公開しました。

          切り抜き作業の 30 分 → 5 分にしてくれるツール。
          配信視聴者から切り抜き師になりたい人に、まず手にしてほしい一本です。

          3 プランあります ▼
          {{booth_url}}

    launch:
      - id: threads-E-1
        weight: 1.0
        text: |
          クリップギフト、購入してくださった方へ。

          ありがとうございます 🙏
          不具合 / 質問あれば、メールから気軽にお声かけください。

          ご感想も嬉しいです、励みになります。
      - id: threads-E-2
        weight: 1.0
        text: |
          スタンダード版の早期割、6/30 までです。

          4,980 円 → 2,980 円
          あと {{days_left}} 日です。

          「業務道具として使う」つもりの方は、このタイミングがおすすめです。
          {{booth_url}}

    longform:
      - id: threads-F-1
        weight: 1.0
        text: |
          切り抜きを始めて 2 年。
          配信視聴者だった私が、月数万円を稼ぐ切り抜き師になり、
          今は自作のツールも公開しようとしています。

          ここまでの道のり、note で連載しています。

          「画面録画疲れた」って毎日のように思ってた頃。
          コメントの盛り上がりを手作業で全部チェックしてた頃。
          そして、自作ツールで作業時間が 1/6 になった瞬間。

          全部、note に書きました。

          {{url}}

  # ============================================================
  # Bluesky - 開発者文脈、補助チャネル、長期信頼貯金
  # ============================================================
  bluesky:
    note_announce:
      - id: bluesky-A-1
        weight: 1.0
        text: |
          note 公開しました。

          {{title}}

          {{summary}}

          {{url}}
      - id: bluesky-A-2
        weight: 1.0
        text: |
          個人開発で作った切り抜き作成ツールについて、
          note で連載しています。

          今回は {{summary}}

          {{url}}

    daily:
      - id: bluesky-B-1
        weight: 1.0
        text: |
          個人開発で「自分のためのツール」を作って、
          気がついたら他の人にも使ってもらえるようになった。

          自分が一番使うから、機能もシンプルに収まる。
          誰のためでもなく自分のためなのに、結果的にスケールする。

          そんなツールが一つ、形になりました。
      - id: bluesky-B-2
        weight: 1.0
        text: |
          今回作った切り抜き作成ツール、
          チャット解析でシーン検出してるんですが、
          普通に正規表現と統計でだいたい何とかなる範囲だった。

          機械学習に頼らない方が、結局速いし精度も読める。

          近日 BOOTH で公開します。
      - id: bluesky-B-3
        weight: 1.0
        text: |
          切り抜き作成ツール、
          SNS 自動投稿システムも自作（Python + GitHub Actions、全部無料）。

          X / Threads / Bluesky 全部対応。
          個人開発でも、ここまで自動化できる時代です。
      - id: bluesky-C-1
        weight: 0.8
        text: |
          配信を最初から最後まで見て、
          盛り上がりシーンを探して、
          コメントを切り出して、
          動画にする。

          これを毎日やってる切り抜き師、本当にすごい。
          私はこれが嫌だったので、ツールを作りました。
      - id: bluesky-C-2
        weight: 0.8
        text: |
          配信を見るのが好きな人ほど、
          実は切り抜き師に向いてるかもしれません。

          「あのシーン、誰か切り抜きにしないかな」
          ってずっと思ってる時点で、
          あなたはすでに切り抜き師の脳みそです。

    teaser:
      - id: bluesky-D-1
        weight: 1.0
        text: |
          切り抜き作成ツール「クリップギフト」、近日 BOOTH で公開します。

          VTuber 切り抜きで実証済み。
          ローカル動作で、クラウド送信不要。
          個人開発で 2 年運用してました。

          詳細は近日 note で。
      - id: bluesky-D-2
        weight: 1.0
        text: |
          クリップギフト、公開しました。

          3 プラン展開で、ライトは 1,980 円から。
          拡張無料版は 9,800 円で、その先の機能拡張すべて永続無料。

          開発者層 / クリエイター層に届けたい一本です。

          {{booth_url}}

    launch:
      - id: bluesky-E-1
        weight: 1.0
        text: |
          切り抜き作成ツールを 2 年運用して気づいたこと:

          1. コメント数の多寡が検出精度を決定する
          2. 動画長が長いほど節約効果は累積
          3. 自作ツールは「自分の使い方」に最適化される

          そういう設計思想で作ったツール、近日公開予定です。
      - id: bluesky-E-2
        weight: 1.0
        text: |
          2026 年、切り抜き界隈は確実に「効率化フェーズ」に入った。

          - コメント流しの標準化
          - AI 字幕ツールの普及
          - 個人開発ツールの台頭

          参入したい人にとっては、整いつつある時期だと思う。
