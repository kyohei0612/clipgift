          選ぶだけで動画になります

          #切り抜き #YouTube切り抜き

      - id: bluesky-v3-4B
        weight: 1.0
        text: |
          操作のイメージで一番近いのが Twitch のクリップ機能

          候補リストから選んで、ドラッグで開始/終了を決めて、書き出し
          そこにニコニコ風コメント流しが自動で乗る仕様です

          頭から見返さなくていいから、最初の 1 本目までが早い

          #切り抜き #動画編集

      - id: bluesky-v3-5A
        weight: 1.0
        text: |
          うちの妻にもこのツール使ってもらってます

          PC 苦手な人なんですけど、1 週間で週 2-3 本ペースで切り抜き出せるようになって、
          本人いわく「これ、選ぶだけだから楽じゃん」って

          身内が普通に使えてるから大丈夫かなと、、

          #切り抜き #副業

      - id: bluesky-v3-5B
        weight: 1.0
        text: |
          切り抜きで一番むずいの操作だと思ってたけど、妻に渡したら 1 週間で慣れた

          「場面を選ぶだけだから難しくない」って本人談

          PC 慣れてる人前提のツールにしたくなくて、そこは結構気にしてます

          #切り抜き #在宅ワーク

      - id: bluesky-v3-6A
        weight: 1.0
        text: |
          AI で量産された切り抜きっぽい動画が増えて、
          本物の配信者の切り抜きと混ざって埋もれる問題が地味にあるんですよね

          このツール、ニコニコ動画みたいなコメント流しが自動で付く仕様
          完全防御じゃないけど、AI 量産物との見分けがつくようにしてます

          #切り抜き #YouTube切り抜き

      - id: bluesky-v3-6B
        weight: 1.0
        text: |
          切り抜き動画にコメント流しが乗ってるかどうかで、見る側の没入感って結構変わる気がする

          このツール、ニコニコ風のコメント流しが自動で付く設計です
          手作業で乗せるのは時間溶けるので、、

          AI 量産動画との区別にもなるかなと

          #切り抜き #動画編集

      - id: bluesky-v3-7A
        weight: 1.0
        text: |
          切り抜きやってる人ならわかると思うけど、
          Google 拡張機能でコメント画面に流して、それを画面録画してた時代

          その間 PC 触れないんですよね、、
          3 時間配信のコメント流し録画してたら、その 3 時間 PC ロック

          あの時間が要らなくなったのが個人的に一番うれしい

          #切り抜き #動画編集

      - id: bluesky-v3-7B
        weight: 1.0
        text: |
          画面録画してる間 PC 使えない問題、切り抜き界の地味にしんどいやつ

          夜にセットして寝るしかなかったり、出かける前に仕掛けて帰ってきたら録画失敗してたり

          これ、もう戻れない、、

          #切り抜き #副業

      - id: bluesky-v3-8A
        weight: 1.0
        text: |
          人気の配信ならコメント欄に有志がタイムスタンプ付けてくれるけど、
          マイナーな配信ってまずタイムスタンプ無いんですよね

          結局自分で全部見て探すしかなくて、ライバル少ないチャンネル狙うほどこの作業が重い

          そこを楽にしたくて作ってます

          #切り抜き #YouTube切り抜き

      - id: bluesky-v3-8B
        weight: 1.0
        text: |
          タイムスタンプ無し配信を一から見直す作業、しんどくないですか

          3 時間配信を 1.5 倍速で見返しても 2 時間
          体力削られて、編集する前にもう疲れてる、、

          そこをコメントベースで自動候補出してくれるツールにしました

          #切り抜き #副業

      - id: bluesky-v3-9A
        weight: 1.0
        text: |
          自分でも切り抜きやってたんですけど、
          配信終わってから何時間で 1 本目出せるかでバズるかが決まる世界で、
          素材選びに半日かかると勝負にならないんですよね

          「もっと早く出せたら」が動機で作りました

          #切り抜き #YouTube切り抜き

      - id: bluesky-v3-9B
        weight: 1.0
        text: |
          切り抜きで一番きついの、配信終わりから公開までの速度勝負

          ライバル弱い chでも、誰かが先に出した時点でほぼ詰む
          素材選びを自動化できれば、その勝負に乗れる

          そう思って作り始めたツールです

          #切り抜き #動画編集

