  threads:
    daily:
      - id: threads-A-T-1
        weight: 1.0
        text: |
          3 ヶ月ハマってた閾値の問題、ようやく抜けた。

          歌枠の「うわー！」が連発する瞬間と、雑談で誰かがポツリ呟いた瞬間。
          同じアルゴリズムで両方拾うの、無理だったんですよね 😅

          ジャンル別にチューニングする方向で逃げました。

          切り抜きやってる人って、盛り上がりの指標どうしてるんだろう。
          コメント密度以外で見てる人いたら教えてほしい。

      - id: threads-A-T-2
        weight: 1.2
        text: |
          配信切り抜きツール作ってて、誤検出 1 割切った 🎬

          YouTube + Twitch のチャット解析でクリップ候補を自動検出するやつ
          3 時間配信に放り込むと 5 分で候補 5 個出てきて、うち 4 個が採用レベル

          3 ヶ月チューニングしてここ
          正直、もっと早く来れると思ってた

          切り抜きやってる人、普段どの工程が一番だるい？
          僕は素材選びが一番しんどかった

      - id: threads-A-T-3
        weight: 0.9
        text: |
          note 3 本目、書き終わった。

          実装でハマって 30 分手が止まったら、note の下書きに逃げる。
          これ意外と効く。
          頭が一回別の場所に行って戻ってくると、コードのバグの場所が見えたりする。

          集中するより切り替える方が、個人的には合ってるっぽい。

          個人開発の人、開発中の気分転換どうしてます？

      - id: threads-C-T-1
        weight: 0.9
        text: |
          切り抜きで伸びる動画って、編集の上手さじゃなくてコメント濃いシーンを切れてるか、なんですよね。

          100 配信分くらい解析して気付いた。
          平均の 3 倍以上にコメント跳ねた瞬間 = 再生伸びるシーン、ほぼ一致する。

          編集綺麗でもコメント薄い場面切ると、見事に伸びない。
          これ最初知ったとき、結構ショックだった。

      - id: threads-D-T-1
        weight: 0.8
        text: |
          Downloads フォルダ、3 年放置してた動画 800 本くらいに膨れ上がってた。
          ヤバい。

          命名規則決めて全部リネームした。
          20260507_ab_1234.mp4 みたいな。
          日付 + 配信者頭文字 + 配信回数。

          これだけで 5 秒で目当ての素材出てくる。
          今までの あれどこだっけ… が嘘みたい。

          皆さんファイル名どうしてます？

      - id: threads-F-T-3
        weight: 0.8
        text: |
          配信のチャット密度をグラフにしてみたら、ここ笑ったって自分が思った瞬間と完全一致してた

          データで見ると気持ちよくて、開発楽しい
          皆さんも配信のあのシーン、覚えてます？

    longform:
      - id: threads-B-T-1
        weight: 1.0
        text: |
          昨日の 3 時間配信、自分でも切り抜き作ってみた。

          前は最初から見直して 3 時間消えてた。
          今回はツールが候補 5 個出してくれて、編集 30 分で 4 本上がった。

          12 倍速。これ笑う。

          しかも候補の 8 割、自分がここ来たって思ったシーンと一致してた。
          切り抜きのセンスって結局コメント密度を見てるだけだったのかも。

      - id: threads-B-T-2
        weight: 1.0
        text: |
          妻が同じツール使い始めて 1 週間。

          「ここのボタン位置おかしい」
          この文字小さくて読めない
          色が地味、テンション上がらない

          容赦なく刺してくる。
          夫が作ったツールへの忖度ゼロ。

          UI 改善が一番進んだのはここ 1 週間。
          身内ユーザー、最強です。

      - id: threads-B-T-3
        weight: 1.2
        text: |
          妻が「私も切り抜きで月 5 万欲しい」って言い出したのが、このツール作るきっかけだった。

          最初は あー無理じゃない？ と思った。
          専門知識ゼロ、編集経験ゼロ、PC スペックも普通。

          でも作業時間さえなんとかすれば、続けられそうな気がした。

          今、妻は週 2-3 本のペースで切り抜き作ってる。
          月 5 万にはまだ届いてないけど、続いてる。

          自動で稼げるツールじゃなくて、続けられるくらい時短する、ってこういうことかなと。

      - id: threads-F-T-1
        weight: 0.9
        text: |
          配信見るのが好きなんですよね

          リアタイで うあああ ってコメントが何百件も流れた瞬間、後で見返すと確実にコメント密度が跳ねてる
          視聴者の面白いって感覚、結局コメント欄に出てるんだなって

          切り抜き作るかは別として、自分の好きな配信者の盛り上がりシーンを自動でピックアップできたら、それだけで配信視聴 2 倍楽しくなる気がしません？

      - id: threads-F-T-2
        weight: 0.9
        text: |
          リアタイで配信観てて あ、今のシーン保存したい って思うこと、ありますよね 🎬

          それを自動でやってくれるツール作ってます
          切り抜き作って投稿するんじゃなくて、自分用に保存するだけでも全然 OK

          自分の好きな配信のあのシーンだけ集めて見返したい、って人他にもいませんか？

    teaser:
      - id: threads-E-T-1
        weight: 1.0
        text: |
          3 年作って、自分でも妻でも使ってきたツール、ようやく出します。

          ClipGift。
          配信のチャットから盛り上がりシーン拾って、クリップ候補にしてくれるやつ。

          通常 9,800 円。
          先着 10 名だけ 6,980 円（11 人目から終売、サブスクに移行）。

          自動で稼げるツールじゃなくて、ちゃんと取り組む人の時短ツールのつもりで作ってます。

          {{booth_url}}

    launch:
      - id: threads-E-T-2-reminder
        weight: 1.0
        text: |
          6,980 円枠、残り {{remaining}} 名 🎬

          11 人目から買い切り終売 → サブスクに切り替えるので、買い切りで欲しい人はここまで。

          迷ってる方、リプか DM で気になるとこ聞いてもらえれば普通に返します。
          これに使えますか？みたいな個別ケースの質問が一番答えやすいです。

          {{booth_url}}

    note_announce:
      - id: threads-note-1
        weight: 1.0
        text: |
          note 連載 #{{number}} 公開しました

          {{title}}

          {{summary}}

          ▼ {{url}}

  # ============================================================
  # Bluesky v2
