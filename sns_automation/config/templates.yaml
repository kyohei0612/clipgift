  bluesky:
    daily:
      - id: bluesky-A-B-1
        weight: 1.2
        text: |
          配信切り抜きツール、誤検出やっと 10% 切った。3 ヶ月かかった。

          歌枠と雑談で別アルゴリズムにしたのが一番効いて、地味な改修ばっかだった。閾値ひとつで終わらないって体感。

          #buildinpublic #個人開発

      - id: bluesky-A-B-2
        weight: 1.0
        text: |
          ジャンル選んだら閾値が勝手に変わる仕組み入れた。

          歌枠は密度跳ねやすくて雑談は逆。同じ閾値だと両方は無理だった。これだけで誤検出 40% → 10%、効くポイントは大体 設定減らす方向にある。

          #個人開発

      - id: bluesky-A-B-3
        weight: 0.9
        text: |
          note 3 本目、書いてる。

          実装で詰まったら note の下書きに逃げる、note で詰まったらコードに戻る。
          集中するより切り替える方が、自分には合ってるっぽい。

          販売もマーケも全部ひとりだけど、これで意外と回る。

          #個人開発 #buildinpublic

      - id: bluesky-B-B-1
        weight: 1.0
        text: |
          昨日の配信で自分のツール使ってみたんだけど、3 時間ぶん見返すのが 5 分で候補出てきて、編集まで入れて 30 分で 4 本完成した。体感で 10 倍は速い。

          あと、自分がここ盛り上がってたと思った箇所と、ツールが出した候補が 8 割重なった。これがちょっと嬉しかった。

          #切り抜き

      - id: bluesky-B-B-2
        weight: 1.0
        text: |
          妻が同じツール使って切り抜き作ってる。前提知識ゼロから 1 週間で週 2-3 本ペースに乗ってきた。

          「ここ意味分からん」が容赦なく飛んでくるので UI が一番直る。エンジニアじゃない人がベータ触ってくれるの効きすぎる。

          #個人開発 #buildinpublic

      - id: bluesky-C-B-1
        weight: 0.9
        text: |
          切り抜きの再生数、編集スキルよりコメント密度跳ねた瞬間を切れてるか、で大半決まってる気がする。

          100 配信ぶん解析して気づいたのは、平均コメント数の 3 倍超えた瞬間と、再生伸びた切り抜きがだいたい重なる。目でやってたことが数字で出る。

          #切り抜き #個人開発

      - id: bluesky-F-B-1
        weight: 0.9
        text: |
          配信のチャット密度をグラフにしてみた

          ここ笑ったと思った瞬間、後で見返すと確実に密度が跳ねてる
          視聴者の体感って結局コメント欄に出てる

          データで見ると気持ちよくて開発楽しい

          #buildinpublic

      - id: bluesky-F-B-2
        weight: 0.8
        text: |
          配信観てて、あ、今のシーン保存したい、と思った瞬間を自動検出するツール、地味に視聴体験変わる

          #個人開発

      - id: bluesky-F-B-3
        weight: 0.8
        text: |
          配信のコメント密度を観察してると、視聴者層の構成で「跳ねるポイント」が違うのが見える
          歌枠と雑談で完全に別の波形

          データから見える配信文化、面白い

          #個人開発

