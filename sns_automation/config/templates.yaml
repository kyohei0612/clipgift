          Google の拡張機能でコメント画面に流して、それを画面録画してた時代

          その間 PC 触れないんですよね
          別のことできない、ただ録画が終わるのを待つ時間

          あの時間が要らなくなったのが個人的に一番うれしい

          #切り抜き #動画編集

      - id: x-v3-7B
        weight: 1.0
        text: |
          切り抜き界の地味にしんどいやつ、
          画面録画してる間 PC 使えない問題

          3 時間配信のコメント流し録画してたら、その 3 時間 PC ロックされて、
          他の作業できないんですよ

          これ、もう戻れない

          #切り抜き #副業

      - id: x-v3-8A
        weight: 1.0
        text: |
          人気の配信ならコメント欄にタイムスタンプつけてくれる有志がいるけど、
          マイナーな配信ってまずタイムスタンプ無いんですよね

          結局自分で全部見て探すしかなくて、
          ライバル少ないチャンネル狙うほどこの作業が重い

          そこを楽にしたくて作ってます

          #切り抜き #YouTube切り抜き

      - id: x-v3-8B
        weight: 1.0
        text: |
          切り抜きやってると地味に詰むのが、
          タイムスタンプ無しの配信を一から見直す作業

          3 時間配信を 1.5 倍速で見返すだけで体力ゴリッと削られるし、
          ジャンルがマイナーなほど誰も付けてくれない

          そこをツールで肩代わりさせてる

          #切り抜き #副業

      - id: x-v3-9A
        weight: 1.0
        text: |
          自分でも切り抜きやってたんですけど、
          配信終わってから何時間で出せるかでバズるかが決まる世界で、
          素材選びに半日かかると勝負にならないんですよね

          「もっと早く 1 本目出せたらな」が動機で作りました

          #切り抜き #YouTube切り抜き

