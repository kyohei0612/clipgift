  # ============================================================
  # Threads v3.1（動機系トーン統一, 2026-05-11 更新）
  # ============================================================
  # 統一基準（kyohei さん承認）:
  #   - 自分の経験を素直に語る（「やってたんですけど」「使ってきて」）
  #   - 控えめな共感誘発（「〜なんですよね」「〜気がする」）
  #   - 流行語・俗語・体育会系強調禁止（「最強」「詰む」「容赦なく」「ヤバい」「神」「これ笑う」）
  #   - 数値先頭フック禁止（「12 倍速」「誤検出 1 割」等を冒頭に置かない）
  #   - エンジニア用語禁止（誤検出 / 閾値 / 解析 / 密度 / アルゴリズム）
  #   - buildinpublic 系禁止（「3 ヶ月かけて」「ハマって」「実装で」）
  #   - 鉤括弧「セリフ」を 2 ヶ所以上使わない（AI コマンド臭）
  #
  # 削除済（2026-05-11 v3.1）:
  #   - 旧 v2: A-T-1 / A-T-2 / A-T-3 / C-T-1 / D-T-1 / F-T-3（既に v2→v3 移行時に削除済）
  #   - threads-B-T-1（「12 倍速。これ笑う」軽口 + 「コメント密度」エンジニア用語）
  #   - threads-F-T-2（絵文字 🎬 + AI 臭の余韻）
  #   - 妻ストーリー系（v3-5A/5B, B-T-2/B-T-3）← Threads 媒体方針（X/Bluesky は継続）
  threads:
    daily:
      - id: threads-v3-2A
        weight: 1.0
        text: |
          切り抜き作る時、配信を頭から見返すのってけっこう体力使うんですよね

          3 時間の雑談配信、6 時間のコラボとかになると、
          見るだけで半日終わる感覚があって

          そこを、配信中の "ｗ" や "笑" のコメントから自動で候補出すツールにしました
          選ぶだけで 1 本になる感じです

      - id: threads-v3-2B
        weight: 1.0
        text: |
          切り抜きやってる人なら共感してもらえる気がするんですけど、

          配信を頭から見返してタイムスタンプ取る作業って、
          作ってる感じじゃなくて、ただ耐えてる感覚なんですよね

          1.5 倍速で見直しても 3 時間配信なら 2 時間
          編集に入る前に疲れてる、というのが地味にしんどくて

          その部分を、コメント拾って候補出すツールに置き換えてみたかったんです

      - id: threads-v3-2C
        weight: 1.0
        text: |
          配信のチャットから盛り上がってるところを拾って、
          切り抜き候補にしてくれるツールを作ってます

          自分でも切り抜きやってた頃に、
          素材選びだけ機械にやってほしいな、と思ってたのが出発点で

          動画を作る作業じゃなくて、
          配信を見る時間そのものを短くしたかったんですよね

      - id: threads-v3-3A
        weight: 1.0
        text: |
          このツール、特に向いてるのが長時間でコメントが活発な配信です

          3〜6 時間の長配信、2〜3 人のコラボ、企画モノのライブとか
          このあたりが一番合う気がしてる

          逆に、コメントが少ない配信や、ライブ終わるとコメントが残らないアーカイブだと弱いです
          "ｗ" を拾う仕組みなので、そこは正直に書いておきたくて

      - id: threads-v3-3B
        weight: 1.0
        text: |
          このツール、コメントが活発な配信が前提なんですよね

          長時間でコラボや雑談みたいな配信は合うけど、
          視聴者が少ない配信、コメントが残らないアーカイブだとあんまり拾えない

          万能じゃないってのは最初に書いておきたくて

          切り抜きやる配信のジャンル、皆さんはどう選んでますか

      - id: threads-v3-4A
        weight: 1.0
        text: |
          使い方、ざっくり 3 ステップです

          ① "ｗ が 5 個以上連発したらクリップ候補にする" みたいなフィルタを決める
          ② ツールが配信全体を見て、条件に合う箇所を一覧で出す
          ③ 候補から選んで、Twitch のクリップ機能みたいに範囲を調整して保存

          判断するのはどれを採用するかだけで、
          頭から見返す必要はない、っていう作りにしてます

      - id: threads-v3-4B
        weight: 1.0
        text: |
          操作のイメージで一番近いのが、Twitch のクリップ機能なんですよね

          候補リストから 1 つ選んで、ドラッグで開始と終了の位置を決めて書き出し
          それを 1 配信から何回か繰り返すだけ

          普段から切り抜きやってる人なら、5 分触れば慣れる気がする

          頭から見返さなくていいので、1 本目までが早くなります

      - id: threads-v3-4C
        weight: 1.0
        text: |
          このツール、自動で動画を作ってくれるわけじゃないんですよね

          候補は出るけど、どれを採用するかは自分で選ぶし、
          範囲も自分で決める

          全自動の AI 動画みたいなのが欲しいわけじゃなくて、
          素材選びの時間だけ短くしたい、という気持ちで作ってます

      - id: threads-v3-6A
        weight: 1.0
        text: |
          最近、配信者の声と画像だけ拝借して AI で量産された切り抜きっぽい動画、
          増えてるじゃないですか

          実映像の切り抜きと AI 量産物が混ざって埋もれるのが、地味にもったいなくて

          このツール、ニコニコ動画風のコメント流しが自動で付くようにしてます
          完全な対策じゃないけど、見分けはつきやすくなる気がしてる

      - id: threads-v3-7A
        weight: 1.0
        text: |
          切り抜き作ってた頃、Google の拡張機能でコメントを画面に流して、
          それを画面録画して素材にしてた時期があったんですよ

          3 時間配信を録画してる間、その 3 時間 PC が触れない
          別のことが何もできなくて、夜にセットして寝るか、出かける前に仕掛けるか

          あの時間にもう戻りたくないな、っていうのがツール作るきっかけでした

      - id: threads-v3-7B
        weight: 1.0
        text: |
          画面録画でコメント流しを作ってた頃、
          PC が録画中ずっと使えないのが地味にきつくて

          夜セットして寝たら、朝起きたら録画が途中で止まってた、みたいなこともあって、
          あの "やり直し" が一番こたえる気がする

          ツールに置き換えてからは、その時間を別のことに使えるようになりました

      - id: threads-v3-8A
        weight: 1.0
        text: |
          切り抜きやってる人ならわかる気がするんですけど、
          人気の配信ってコメント欄に有志がタイムスタンプ付けてくれるじゃないですか

          ライバル少ないチャンネル狙うと、誰もタイムスタンプ付けてくれないんですよね

          結局 3 時間の配信を自分で全部見て、面白いところを探すしかない
          ジャンル攻めるほど作業が重くなる、というのが地味にしんどくて

          そこを楽にしたくて作ってます

      - id: threads-v3-8B
        weight: 1.0
        text: |
          切り抜きやってる人に聞きたいんですけど、
          タイムスタンプ無しの配信を一から見直す作業って、しんどくないですか

          1.5 倍速にしても 3 時間配信なら 2 時間
          体力削られて、編集に入る前にもう疲れてる

          そこをコメントから自動で候補出すツールにしたら、
          1 本目までがだいぶ早くなった気がしてます

      - id: threads-v3-9A
        weight: 1.0
        text: |
          切り抜きやってたんですけど、配信終わってから何時間で 1 本目出せるかで
          バズるかが決まる世界なんですよね

          ライバル多いチャンネルだと、誰かが先に出した時点で勝負にならない
          ライバル少ないチャンネルだと、今度はタイムスタンプが無いから自分で全部見るしかない

          その素材選びのフェーズだけツールに肩代わりさせたくて作りました

    longform:
      - id: threads-F-T-1
        weight: 0.9
        text: |
          配信を見るのが好きなんですよね

          リアタイで うあああ って何百件もコメントが流れた瞬間、
          後で見返すと、そこのコメントの数が確実に増えてる

          視聴者が面白いと感じてるところって、
          結局コメント欄に出てるんだなと思って

          切り抜きを作るかは別として、自分の好きな配信者の盛り上がってるところを
          自動でピックアップできたら、配信を見る楽しみが増える気がしません

      - id: threads-motive-longform-1
        weight: 1.0
        text: |
          切り抜きをやってた頃の話なんですけど、
          配信終わってから何時間で 1 本目を出せるかで、その動画が伸びるかが決まるんですよね

          ライバルが多いチャンネルだと、誰かが先に出した時点でほぼ見られない
          ライバルが少ないチャンネルだと、今度はタイムスタンプを誰も付けてくれないから、
          自分で全部見るしかない

          どっちを選んでも、結局素材選びの時間が一番きつい

          そこだけツールに肩代わりさせたくて作ったのが、いま手元にあるやつです
          編集も投稿も自分でやる、選ぶ時間だけ短くする、というつもりで作ってます

      - id: threads-motive-longform-2
        weight: 1.0
        text: |
          切り抜きを自分で作ってた時の感覚として、
          一番しんどかったのは編集じゃなくて、その手前の素材を見つける時間でした

          3 時間配信を 1.5 倍速で見直しても 2 時間、
          見終わる頃にはもう編集する気が残ってない、というのが何回もあって

          作る側じゃなくて、配信を見てる側の感覚に近かった気がします
          ここのシーン後で誰か切り抜き出すかな、って思いながら見てる、あの感じ

          その "ここ" だけ、ツールにメモしておいてもらえたらなと思って作りました

