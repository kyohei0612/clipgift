# SNS 投稿テンプレート v2（自動投稿システム用）
#
# 構造:
#   templates:
#     <platform>:
#       <category>:
#         - id: 一意の識別子（履歴記録用）
#           text: 投稿本文（{{変数}} で動的部分を表現）
#           weight: 重み（高いほど選ばれやすい、デフォルト 1.0）
#
# 出典: .company/marketing/sns/{x,threads,bluesky}-templates-v2.md（修正後採用版）
# 設計書: .company/marketing/sns/2026-05-09-ai-rinse-research.md
# v1 バックアップ: templates.yaml.v1.bak
#
# カテゴリマッピング（schedule.yaml と整合）:
#   daily       = 日常投稿（A 進捗 / B 共感 / C 観察 / F 視聴者層）
#   achievement = 数値訴求（A 系）
#   longform    = Threads 長文（B 系メイン、妻運用の物語含む）
#   teaser      = 告知ティーザー（E 系）
#   launch      = ローンチ当日（E 系）
#   note_announce = note 連動告知（{{url}} 等動的変数あり）
#
# NG ワード厳守: cross_review.py の FATAL_NG_WORDS 参照
# 安全上限: X 278 / Threads 498 / Bluesky 298（auto_trim.py の SAFE_LIMITS）

templates:
  # ============================================================
  # X (Twitter) v2
  # ============================================================
  x:
    daily:
      - id: x-v3-2A
        weight: 1.0
        text: |
          配信の "ｗ" とか "笑" を拾って、自動でクリップ候補出してくれるツール作ってた

          3 時間配信を最初から見返さなくていい、
          盛り上がってる場面が一覧で並ぶから「選ぶだけ」になる感覚

          切り抜きチャンネル特化で組んでます

          #切り抜き #YouTube切り抜き

      - id: x-v3-2B
        weight: 1.0
        text: |
          切り抜き作る時、配信全部見返してタイムスタンプ自分で取ってた頃、
          3 時間配信に半日かかってた

          それを「ｗ が連発してる場面」を自動で拾うツールに置き換えたら、
          最初の候補出るまで 5 分くらいで終わるようになった

          #切り抜き #動画編集

      - id: x-v3-3A
        weight: 1.0
        text: |
          このツール、長時間配信が一番得意です

          3〜6 時間の配信、コラボ、雑談配信あたりで真価出る
          逆にコメント少ない配信や、コメントが残らない配信は苦手

          「コメント活発」が前提条件だけど、
          そこさえハマれば素材選びの時間が劇的に縮む

          #切り抜き #YouTube切り抜き

      - id: x-v3-3B
        weight: 1.0
        text: |
          2 人コラボの 4 時間配信とか、
          企画モノの 6 時間ライブとか、
          雑談配信の 1 時間半とか

          長くなるほど切り抜き作業がしんどくなる配信ほど、
          このツールで時間が縮む

          短い配信より長い配信向き

          #切り抜き #副業

      - id: x-v3-4A
        weight: 1.0
        text: |
          使い方シンプルにすると 3 ステップ

          ①「ｗ が 5 個以上連発したらクリップ」みたいなフィルタ設定
          ② ツールが配信から候補を拾って一覧で出す
          ③ 候補から選んで、Twitch クリップみたいに範囲を調整して保存

          選ぶだけで動画になる感覚です

          #切り抜き #YouTube切り抜き

      - id: x-v3-4B
        weight: 1.0
        text: |
          配信を頭から見返さなくていい、ってのが体感的に一番でかい

          「ｗ」「笑」「草」みたいな反応コメントを指定しておくと、
          盛り上がってる箇所が自動で並ぶ

          そこから Twitch のクリップ機能みたいに範囲をドラッグして調整、
          それで 1 本出来上がる

          #切り抜き #動画編集

      # ★ x-v3-5A / x-v3-5B（妻が 1 週間で慣れた系）は kyohei さん指示 2026-05-11 で削除。
      #   理由: 「1 週間で慣れた」「PC 苦手なのに」「身内が使えてるから大丈夫」等の
      #         自慢っぽい言い回しが kyohei さんの好みに合わなかったため。
      #   妻関連を残すなら自慢じゃなく観察・事実ベースで再構成する。

      - id: x-v3-6A
        weight: 1.0
        text: |
          最近 AI で量産された切り抜きっぽい動画が増えてて、
          本物の配信者の切り抜きと混ざって埋もれる問題ある

          このツール、ニコニコ動画みたいなコメント流しが自動で付く仕様で、
          AI 量産物との見分けがつくようにしてます

          完全な対策じゃないけど、識別はされやすくなる

          #切り抜き #YouTube切り抜き

      - id: x-v3-7A
