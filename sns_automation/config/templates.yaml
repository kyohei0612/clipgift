# SNS 投稿テンプレート v2（自動投稿システム用）
#
# 構造:
#   templates:
#     <platform>:
#       <category>:
#         - id: 一意の識別子（履歴記録用）
#           text: 投稿本文（{{変数}} で動的部分を表現）
#           weight: 重み（高いほど選ばれやすい、デフォルト 1.0）
#
# 出典: .company/marketing/sns/{x,threads,bluesky}-templates-v2.md（修正後採用版）
# 設計書: .company/marketing/sns/2026-05-09-ai-rinse-research.md
# v1 バックアップ: templates.yaml.v1.bak
#
# カテゴリマッピング（schedule.yaml と整合）:
#   daily       = 日常投稿（A 進捗 / B 共感 / C 観察 / F 視聴者層）
#   achievement = 数値訴求（A 系）
#   longform    = Threads 長文（B 系メイン、妻運用の物語含む）
#   teaser      = 告知ティーザー（E 系）
#   launch      = ローンチ当日（E 系）
#   note_announce = note 連動告知（{{url}} 等動的変数あり）
#
# NG ワード厳守: cross_review.py の FATAL_NG_WORDS 参照
# 安全上限: X 278 / Threads 498 / Bluesky 298（auto_trim.py の SAFE_LIMITS）

templates:
  # ============================================================
  # X (Twitter) v2
  # ============================================================
  x:
    daily:
      - id: x-v3-2A
        weight: 1.0
        text: |
          配信の "ｗ" とか "笑" を拾って、自動でクリップ候補出してくれるツール作ってた

          3 時間配信を最初から見返さなくていい、
          盛り上がってる場面が一覧で並ぶから「選ぶだけ」になる感覚

          切り抜きチャンネル特化で組んでます

          #切り抜き #YouTube切り抜き

      - id: x-v3-2B
        weight: 1.0
        text: |
          切り抜き作る時、配信全部見返してタイムスタンプ自分で取ってた頃、
          3 時間配信に半日かかってた

          それを「ｗ が連発してる場面」を自動で拾うツールに置き換えたら、
          最初の候補出るまで 5 分くらいで終わるようになった

          #切り抜き #動画編集

      - id: x-v3-3A
        weight: 1.0
        text: |
          このツール、長時間配信が一番得意です

          3〜6 時間の配信、コラボ、雑談配信あたりで真価出る
          逆にコメント少ない配信や、コメントが残らない配信は苦手

          「コメント活発」が前提条件だけど、
          そこさえハマれば素材選びの時間が劇的に縮む

          #切り抜き #YouTube切り抜き

      - id: x-v3-3B
        weight: 1.0
        text: |
          2 人コラボの 4 時間配信とか、
          企画モノの 6 時間ライブとか、
          雑談配信の 1 時間半とか

          長くなるほど切り抜き作業がしんどくなる配信ほど、
          このツールで時間が縮む

          短い配信より長い配信向き

          #切り抜き #副業

      - id: x-v3-4A
        weight: 1.0
        text: |
          使い方シンプルにすると 3 ステップ

          ①「ｗ が 5 個以上連発したらクリップ」みたいなフィルタ設定
          ② ツールが配信から候補を拾って一覧で出す
          ③ 候補から選んで、Twitch クリップみたいに範囲を調整して保存

          選ぶだけで動画になる感覚です

          #切り抜き #YouTube切り抜き

      - id: x-v3-4B
        weight: 1.0
        text: |
          配信を頭から見返さなくていい、ってのが体感的に一番でかい

          「ｗ」「笑」「草」みたいな反応コメントを指定しておくと、
          盛り上がってる箇所が自動で並ぶ

          そこから Twitch のクリップ機能みたいに範囲をドラッグして調整、
          それで 1 本出来上がる

          #切り抜き #動画編集

      - id: x-v3-5A
        weight: 1.0
        text: |
          うちの妻にこのツール渡して使ってもらってた

          PC 苦手な人なんですけど、1 週間で週 2-3 本ペースで切り抜き出せるようになって、
          「これ、選ぶだけだから楽じゃん」って言われた

          身内が普通に使えてるから大丈夫かなと

          #切り抜き #副業

      - id: x-v3-5B
        weight: 1.0
        text: |
          切り抜きで一番むずいの操作だと思ってたけど、
          妻にツール渡したら 1 週間で慣れた

          「場面を選ぶだけだから難しくない」って本人談

          PC 慣れてる人前提のツールにはしたくなくて、
          そこは結構気にして作ってます

          #切り抜き #在宅ワーク

      - id: x-v3-6A
        weight: 1.0
        text: |
          最近 AI で量産された切り抜きっぽい動画が増えてて、
          本物の配信者の切り抜きと混ざって埋もれる問題ある

          このツール、ニコニコ動画みたいなコメント流しが自動で付く仕様で、
          AI 量産物との見分けがつくようにしてます

          完全な対策じゃないけど、識別はされやすくなる

          #切り抜き #YouTube切り抜き

      - id: x-v3-7A
        weight: 1.0
        text: |
          切り抜きやってる人ならわかると思うけど、
          Google の拡張機能でコメント画面に流して、それを画面録画してた時代

          その間 PC 触れないんですよね
          別のことできない、ただ録画が終わるのを待つ時間

          あの時間が要らなくなったのが個人的に一番うれしい

          #切り抜き #動画編集

      - id: x-v3-7B
        weight: 1.0
        text: |
          切り抜き界の地味にしんどいやつ、
          画面録画してる間 PC 使えない問題

          3 時間配信のコメント流し録画してたら、その 3 時間 PC ロックされて、
          他の作業できないんですよ

          これ、もう戻れない

          #切り抜き #副業

      - id: x-v3-8A
        weight: 1.0
        text: |
          人気の配信ならコメント欄にタイムスタンプつけてくれる有志がいるけど、
          マイナーな配信ってまずタイムスタンプ無いんですよね

          結局自分で全部見て探すしかなくて、
          ライバル少ないチャンネル狙うほどこの作業が重い

          そこを楽にしたくて作ってます

          #切り抜き #YouTube切り抜き

      - id: x-v3-8B
        weight: 1.0
        text: |
          切り抜きやってると地味に詰むのが、
          タイムスタンプ無しの配信を一から見直す作業

          3 時間配信を 1.5 倍速で見返すだけで体力ゴリッと削られるし、
          ジャンルがマイナーなほど誰も付けてくれない

          そこをツールで肩代わりさせてる

          #切り抜き #副業

      - id: x-v3-9A
        weight: 1.0
        text: |
          自分でも切り抜きやってたんですけど、
          配信終わってから何時間で出せるかでバズるかが決まる世界で、
          素材選びに半日かかると勝負にならないんですよね

          「もっと早く 1 本目出せたらな」が動機で作りました

          #切り抜き #YouTube切り抜き

    achievement:
      - id: x-B-X-1
        weight: 1.0
        text: |
          昨日の配信 3 時間、自分で切り抜き作ってみた

          前は最初から見返すだけで 3 時間消えてたのが、
          候補出るのが 5 分、編集合わせて 30 分で 4 本

          10 倍以上速くなってる。やばい

          ▼ BOOTH（先着 10 名 6,980 円）
          {{booth_url}}

          #切り抜き

    teaser:
      - id: x-E-X-1
        weight: 1.0
        text: |
          ClipGift、ようやく出します

          切り抜き副業の作業時間を 1/3 にする時短ツールです
          自動で稼げるツールじゃなくて、ちゃんと取り組む人の半分の時間を返すやつ

          通常 9,800 円、先着 10 名は 6,980 円

          ▼ BOOTH
          {{booth_url}}

          #切り抜き #個人開発

    launch:
      - id: x-E-X-1-launch
        weight: 1.0
        text: |
          ClipGift、ようやく出します

          切り抜き副業の作業時間を 1/3 にする時短ツールです
          自動で稼げるツールじゃなくて、ちゃんと取り組む人の半分の時間を返すやつ

          通常 9,800 円、先着 10 名は 6,980 円

          ▼ BOOTH
          {{booth_url}}

          #切り抜き #個人開発

    note_announce:
      - id: x-note-1
        weight: 1.0
        text: |
          note 連載 #{{number}}

          {{title}}

          {{summary}}

          ▼ {{url}}

          #切り抜き #個人開発

      - id: x-note-2
        weight: 1.0
        text: |
          note 書きました

          {{title}}

          {{hint}}

          ▼ {{url}}

          #切り抜き

  # ============================================================
  # Threads v2
  # ============================================================
  threads:
    daily:
      - id: threads-v3-2A
        weight: 1.0
        text: |
          配信の切り抜きを作るのに、配信全体を見返すのって体力削られるじゃないですか

          3 時間の雑談配信、6 時間のコラボ、長くなるほど大変で、
          タイムスタンプ自分で取って、面白そうなところに当たり付けて、編集ソフト立ち上げて、、、

          その「素材選び」を、配信中の "ｗ" や "笑" のコメントから
          自動で拾って候補にしてくれるツールを作ってます

          切り抜きチャンネル特化、選ぶだけで 1 本になる感覚です

      - id: threads-v3-2B
        weight: 1.0
        text: |
          切り抜きやってる人なら、これ共感してもらえる気がするんですけど、

          配信頭から見返してタイムスタンプ取る作業って、
          「やってる」じゃなくて「耐えてる」感覚なんですよね

          3 時間配信を 1.5 倍速で見直しても、それで 2 時間
          体力ゴリッと削られて、編集に入る前に疲れ果てる

          その時間を、コメント拾って自動で候補出すツールに置き換えました
          切り抜きチャンネル特化です

      - id: threads-v3-3A
        weight: 1.0
        text: |
          このツール、特に得意なのが「長時間 × コメント活発」な配信です

          3-6 時間の長配信、2-3 人のコラボ配信、企画モノのライブ
          このあたりが一番ハマる

          逆に、コメント数が少ない配信や、ライブが終わるとコメントが残らない配信は苦手
          「ｗ」を拾うって仕組みなので、コメントが活発じゃないと候補出せないんですよね

          得意な配信を見極めて使うのがコツな気がします

      - id: threads-v3-3B
        weight: 1.0
        text: |
          正直に書くと、このツールが活きるのは「コメントが活発な配信」が前提で、

          長時間 × コラボ × 雑談みたいな配信は得意
          でも、視聴者が少ない配信、コメントが残らないアーカイブだと弱い

          万能ツールじゃないってのは最初に言っておきたくて

          切り抜きやる配信のジャンル、皆さんはどう選んでます？

      - id: threads-v3-4A
        weight: 1.0
        text: |
          使い方シンプルなんですけど、ざっくり 3 ステップで動きます

          ①「ｗ が 5 個以上連発したらクリップ候補にする」みたいなフィルタを最初に決める
          ② ツールが配信全体をスキャンして、条件にハマる箇所を一覧で出してくれる
          ③ 候補から採用するものを選んで、Twitch のクリップ機能みたいに範囲をドラッグして調整、保存

          判断するのはどれを採用するかだけで、
          頭から見返す必要はないって設計になってます

          PC の前で動画ぼーっと見続ける時間が消える感じです

      - id: threads-v3-4B
        weight: 1.0
        text: |
          操作のイメージで一番近いの、Twitch のクリップ機能なんですよね

          候補リストから 1 つ選んで、ドラッグで開始 / 終了の位置を調整して、書き出し
          それを 1 配信から複数回繰り返す

          普通に切り抜きやってる人なら、たぶん 5 分触れば慣れる感覚

          頭から見返さなくていいから、最初の 1 本目までが圧倒的に早いです

      # ★ threads-v3-5A / threads-v3-5B（妻ストーリー）は kyohei さん指示 2026-05-11 で削除。
      #   Threads では妻目線の投稿はしない方針に変更。X / Bluesky は妻ストーリー継続。

      - id: threads-v3-6A
        weight: 1.0
        text: |
          最近、配信者の声と画像だけ拝借して AI で量産されてる切り抜き動画、
          増えてるじゃないですか

          実体のある配信者の切り抜きと、AI 量産物が混ざって埋もれる問題が地味にあって

          このツール、ニコニコ動画風のコメント流しが自動で付く仕様にしてます
          完全防御じゃないけど、AI 量産物と見分けがつくようにしておきたくて

          最近の AI 量産動画、皆さんどう思ってます？

      - id: threads-v3-7A
        weight: 1.0
        text: |
          昔、切り抜き作るのに Google 拡張機能でコメント画面に流して、
          それを画面録画して素材にしてた時期があったんですよ

          3 時間配信のコメント流し録画してると、その 3 時間 PC ロックされて、
          他のことが何もできない

          夜にセットして寝るしかなかったり、
          朝出かける前にセットして帰ってきたら録画失敗してたり

          あの時間に戻りたくない、ってのがツール作るモチベになりました

      - id: threads-v3-8A
        weight: 1.0
        text: |
          切り抜きやってる人ならわかると思うんですけど、
          人気のある配信ってコメント欄に有志がタイムスタンプ付けてくれるじゃないですか

          ライバル少ないチャンネル狙うほど、誰もタイムスタンプ付けてくれないんですよ

          結局、3 時間の配信を全部自分で見直して、面白そうな場面を探すしかない
          ジャンル攻めれば攻めるほど作業量が増える、という地獄

          そこを楽にしたくて作ってます

      - id: threads-v3-8B
        weight: 1.0
        text: |
          切り抜きやってる人に質問なんですけど、
          タイムスタンプ無し配信を一から見直す作業、しんどくないですか

          3 時間配信を 1.5 倍速で見返しても 2 時間、
          体力削られて、編集する前にもう疲れてる

          そこをコメントベースで自動候補出してくれるツールにしたら、
          最初の 1 本目までがぐっと早くなった

          似た経験ある人いるかな

      - id: threads-v3-9A
        weight: 1.0
        text: |
          切り抜きやってたんですけど、結局、配信終わってから何時間で 1 本目出せるかで
          バズるかどうかが決まる世界なんですよね

          ライバル多いチャンネル狙うと、誰かが先に出した時点で勝負にならない
          ライバル少ないチャンネル狙うと、今度は素材選びに時間がかかる

          「素材選び」のフェーズが圧倒的に重い、
          じゃあそこを自動化すればいいじゃん、って動機で作り始めました

    longform:
      - id: threads-B-T-1
        weight: 1.0
        text: |
          昨日の 3 時間配信、自分でも切り抜き作ってみた。

          前は最初から見直して 3 時間消えてた。
          今回はツールが候補 5 個出してくれて、編集 30 分で 4 本上がった。

          12 倍速。これ笑う。

          しかも候補の 8 割、自分がここ来たって思ったシーンと一致してた。
          切り抜きのセンスって結局コメント密度を見てるだけだったのかも。

      # ★ threads-B-T-2 / threads-B-T-3（妻ストーリー）は kyohei さん指示 2026-05-11 で削除。
      #   理由 1: Threads では妻目線の投稿はしない方針
      #   理由 2: 「容赦なく刺してくる / 忖度ゼロ / 最強です」等の日本語が
      #          バズ狙い・AI 臭で公式アカウント運用の品位に合わなかった
      #   X / Bluesky の妻ストーリーは継続（媒体ごとに別判断）

      - id: threads-F-T-1
        weight: 0.9
        text: |
          配信見るのが好きなんですよね

          リアタイで うあああ ってコメントが何百件も流れた瞬間、後で見返すと確実にコメント密度が跳ねてる
          視聴者の面白いって感覚、結局コメント欄に出てるんだなって

          切り抜き作るかは別として、自分の好きな配信者の盛り上がりシーンを自動でピックアップできたら、それだけで配信視聴 2 倍楽しくなる気がしません？

      - id: threads-F-T-2
        weight: 0.9
        text: |
          リアタイで配信観てて あ、今のシーン保存したい って思うこと、ありますよね 🎬

          それを自動でやってくれるツール作ってます
          切り抜き作って投稿するんじゃなくて、自分用に保存するだけでも全然 OK

          自分の好きな配信のあのシーンだけ集めて見返したい、って人他にもいませんか？

    teaser:
      - id: threads-E-T-1
        weight: 1.0
        text: |
          3 年作って、自分でも妻でも使ってきたツール、ようやく出します。

          ClipGift。
          配信のチャットから盛り上がりシーン拾って、クリップ候補にしてくれるやつ。

          通常 9,800 円。
          先着 10 名だけ 6,980 円（11 人目から終売、サブスクに移行）。

          自動で稼げるツールじゃなくて、ちゃんと取り組む人の時短ツールのつもりで作ってます。

          {{booth_url}}

    launch:
      - id: threads-E-T-2-reminder
        weight: 1.0
        text: |
          6,980 円枠、残り {{remaining}} 名 🎬

          11 人目から買い切り終売 → サブスクに切り替えるので、買い切りで欲しい人はここまで。

          迷ってる方、リプか DM で気になるとこ聞いてもらえれば普通に返します。
          これに使えますか？みたいな個別ケースの質問が一番答えやすいです。

          {{booth_url}}

    note_announce:
      - id: threads-note-1
        weight: 1.0
        text: |
          note 連載 #{{number}} 公開しました

          {{title}}

          {{summary}}

          ▼ {{url}}

