        text: |
          配信全部見返してタイムスタンプ自分で取ってた頃、3 時間配信に半日かかってた

          それを「ｗ が連発してる場面」を自動で拾うツールにしたら、
          最初の候補が出るまで 5 分もかからなくなった、、

          地味に体力削られる作業だったので

          #切り抜き #動画編集

      - id: bluesky-v3-3A
        weight: 1.0
        text: |
          このツール、長時間配信が一番得意です

          3〜6 時間の長配信、コラボ、雑談配信、コメント活発な配信ほど真価出る
          逆にコメント少ない配信や、コメントが残らない配信は苦手

          「コメント活発」が前提だけど、そこさえハマれば素材選びの時間が一気に縮む

          #切り抜き #YouTube切り抜き

      - id: bluesky-v3-3B
        weight: 1.0
        text: |
          2 人コラボの 4 時間配信とか、企画モノの 6 時間ライブとか、
          雑談配信の 1 時間半とか

          長くなるほど切り抜き作業がしんどくなる配信ほど、このツールで時間が縮みます

          短い配信より長い配信向きです

          #切り抜き #副業

      - id: bluesky-v3-4A
        weight: 1.0
        text: |
          使い方シンプルにすると 3 ステップ

          ①「ｗ が 5 個以上連発したらクリップ」みたいなフィルタを決める
          ② ツールが配信から候補を拾って一覧で出す
          ③ 候補を選んで Twitch クリップみたいに範囲をドラッグして保存

          選ぶだけで動画になります

          #切り抜き #YouTube切り抜き

      - id: bluesky-v3-4B
        weight: 1.0
        text: |
          操作のイメージで一番近いのが Twitch のクリップ機能

          候補リストから選んで、ドラッグで開始/終了を決めて、書き出し
          そこにニコニコ風コメント流しが自動で乗る仕様です

          頭から見返さなくていいから、最初の 1 本目までが早い

          #切り抜き #動画編集

      # ★ bluesky-v3-5A / bluesky-v3-5B（妻が 1 週間で慣れた系）は kyohei さん指示 2026-05-11 で削除。
      #   理由: X / Threads 同様、「1 週間で慣れた」「PC 苦手なのに」「身内が使えてるから大丈夫」等の
      #         自慢っぽい言い回しが好みに合わなかったため。

      - id: bluesky-v3-6A
        weight: 1.0
        text: |
          AI で量産された切り抜きっぽい動画が増えて、
          本物の配信者の切り抜きと混ざって埋もれる問題が地味にあるんですよね

          このツール、ニコニコ動画みたいなコメント流しが自動で付く仕様
          完全防御じゃないけど、AI 量産物との見分けがつくようにしてます

          #切り抜き #YouTube切り抜き

      - id: bluesky-v3-6B
        weight: 1.0
        text: |
          切り抜き動画にコメント流しが乗ってるかどうかで、見る側の没入感って結構変わる気がする

          このツール、ニコニコ風のコメント流しが自動で付く設計です
          手作業で乗せるのは時間溶けるので、、

          AI 量産動画との区別にもなるかなと

          #切り抜き #動画編集

      - id: bluesky-v3-7A
        weight: 1.0
        text: |
          切り抜きやってる人ならわかると思うけど、
          Google 拡張機能でコメント画面に流して、それを画面録画してた時代

          その間 PC 触れないんですよね、、
          3 時間配信のコメント流し録画してたら、その 3 時間 PC ロック

          あの時間が要らなくなったのが個人的に一番うれしい

          #切り抜き #動画編集

      - id: bluesky-v3-7B
        weight: 1.0
        text: |
          画面録画してる間 PC 使えない問題、切り抜き界の地味にしんどいやつ

          夜にセットして寝るしかなかったり、出かける前に仕掛けて帰ってきたら録画失敗してたり

          これ、もう戻れない、、

          #切り抜き #副業

      - id: bluesky-v3-8A
        weight: 1.0
        text: |
          人気の配信ならコメント欄に有志がタイムスタンプ付けてくれるけど、
          マイナーな配信ってまずタイムスタンプ無いんですよね

          結局自分で全部見て探すしかなくて、ライバル少ないチャンネル狙うほどこの作業が重い

          そこを楽にしたくて作ってます

          #切り抜き #YouTube切り抜き

      - id: bluesky-v3-8B
        weight: 1.0
        text: |
          タイムスタンプ無し配信を一から見直す作業、しんどくないですか

          3 時間配信を 1.5 倍速で見返しても 2 時間
          体力削られて、編集する前にもう疲れてる、、

          そこをコメントベースで自動候補出してくれるツールにしました

          #切り抜き #副業

      - id: bluesky-v3-9A
        weight: 1.0
        text: |
          自分でも切り抜きやってたんですけど、
          配信終わってから何時間で 1 本目出せるかでバズるかが決まる世界で、
          素材選びに半日かかると勝負にならないんですよね

          「もっと早く出せたら」が動機で作りました

          #切り抜き #YouTube切り抜き

      - id: bluesky-v3-9B
        weight: 1.0
        text: |
          切り抜きで一番きついの、配信終わりから公開までの速度勝負

          ライバル弱い chでも、誰かが先に出した時点でほぼ詰む
          素材選びを自動化できれば、その勝負に乗れる

          そう思って作り始めたツールです

          #切り抜き #動画編集

