# SNS 投稿テンプレート v2（自動投稿システム用）
#
# 構造:
#   templates:
#     <platform>:
#       <category>:
#         - id: 一意の識別子（履歴記録用）
#           text: 投稿本文（{{変数}} で動的部分を表現）
#           weight: 重み（高いほど選ばれやすい、デフォルト 1.0）
#
# 出典: .company/marketing/sns/{x,threads,bluesky}-templates-v2.md（修正後採用版）
# 設計書: .company/marketing/sns/2026-05-09-ai-rinse-research.md
# v1 バックアップ: templates.yaml.v1.bak
#
# カテゴリマッピング（schedule.yaml と整合）:
#   daily       = 日常投稿（A 進捗 / B 共感 / C 観察 / F 視聴者層）
#   achievement = 数値訴求（A 系）
#   longform    = Threads 長文（B 系メイン、妻運用の物語含む）
#   teaser      = 告知ティーザー（E 系）
#   launch      = ローンチ当日（E 系）
#   note_announce = note 連動告知（{{url}} 等動的変数あり）
#
# NG ワード厳守: cross_review.py の FATAL_NG_WORDS 参照
# 安全上限: X 278 / Threads 498 / Bluesky 298（auto_trim.py の SAFE_LIMITS）

templates:
  # ============================================================
  # X (Twitter) v2
  # ============================================================
  x:
    daily:
      - id: x-A-X-1
        weight: 1.2
        text: |
          配信切り抜きツールの誤検出、1 割切った

          YouTube + Twitch のチャット解析でクリップ候補を自動検出するやつを作ってて、
          3 時間配信から 5 分で候補 5 個、うち 4 個は採用レベルになった

          3 ヶ月チューニング、地味だけどここまで来るのが長かった

          #個人開発 #切り抜き

      - id: x-A-X-2
        weight: 1.0
        text: |
          切り抜きツール 3 ヶ月作って、ようやく公開できそう

          ハマったのはガチ恋構文の判定で、
          配信ジャンル変わると閾値ぜんぜん違うんですよね

          低テンションの雑談配信が一番むずい

          #個人開発

      - id: x-B-X-2
        weight: 1.0
        text: |
          切り抜きでいちばんしんどいの、
          配信最初から見返すのと、編集ソフトのスクラブなんですよね

          3 時間配信を 1.5 倍速で見直すだけで体力ゴリゴリ削られる

          そこを 5 分にしたくて作ってる

          #切り抜き

      - id: x-B-X-3
        weight: 1.0
        text: |
          うちの妻も同じツールで切り抜き作ってる

          PC ほぼ初心者だったのに、1 週間で週 2-3 本ペースまで来た
          「これ思ってたより簡単じゃん」って言われて、ちょっと泣きそうになった

          身内が普通に使えるなら大丈夫かなと

          #切り抜き

      - id: x-C-X-1
        weight: 0.9
        text: |
          切り抜きで伸びるかどうかって、
          編集の上手さじゃなくてコメントが密集してる瞬間を切れてるか、なんですよね

          100 配信くらい解析して気づいたけど、
          平均コメ数の 3 倍超えてる瞬間がだいたい再生伸びる

          編集スキルより目の問題

          #切り抜き

      - id: x-F-X-1
        weight: 0.8
        text: |
          配信のアーカイブ見返してて「あ、ここもう一回見たい」って思ったところ、自動で切り出せたら最高だよなって思って作ってる

          #個人開発

      - id: x-F-X-2
        weight: 0.8
        text: |
