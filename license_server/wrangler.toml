name = "clipgift-license"
main = "src/index.ts"
compatibility_date = "2026-05-06"

# Workers KV（無料枠: 1GB / 100k reads / 1k writes per day）
# 2026-05-07 本番作成: clipgift-license-LICENSES
[[kv_namespaces]]
binding = "LICENSES"
id = "a9335879f8054cf9b1ec14719c668985"

# 環境変数（公開可能なもののみ）
[vars]
PRODUCT_PREFIX = "CGFT"
MAX_MACHINES = "2"
OFFLINE_GRACE_DAYS = "30"
HEARTBEAT_INTERVAL_DAYS = "30"
# Phase 2 サブスク: サブスクキーの verify 間隔（日）。短くすると解約が早く反映される。
SUBSCRIPTION_HEARTBEAT_DAYS = "3"

# シークレット（wrangler secret put で登録、コミット禁止）:
#   HMAC_SECRET                  - キー署名用（32 byte 以上のランダム）
#   ADMIN_BEARER_TOKEN           - /admin/* および /support/{notify,reply,pending,processed} 認証用
#                                  （現状サポート系も同じトークンで認証している。
#                                   将来分離する場合は SUPPORT_ADMIN_TOKEN を新設予定）
#   RESEND_API_KEY               - Resend メール送信 API キー
#   SUPPORT_FROM_ADDRESS         - 送信元メールアドレス（Resend 認証済ドメイン）
#   SUPPORT_FORWARD_TO           - エラー報告／要望通知の転送先（運営宛）
#   SUPPORT_FORWARD_TO_REQUEST   - 要望（report_type=request）の対応依頼先
#   SUPPORT_REPLY_TO             - Reply-To アドレス（任意、未設定なら SUPPORT_FORWARD_TO 流用）
#
#   ── Phase 2 サブスク土台（未設定なら /stripe/webhook は 503 で眠ったまま）──
#   STRIPE_WEBHOOK_SECRET        - Stripe webhook 署名シークレット（whsec_...）。
#                                  これを設定した瞬間にサブスク機能が起動する。
#                                  Stripe ダッシュボード → Developers → Webhooks でエンドポイント
#                                  （https://clipgift-license.<acct>.workers.dev/stripe/webhook）を登録して取得。

[build]
command = "npm install"
