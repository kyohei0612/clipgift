[package]
name = "clipgift"
version = "1.0.120"
description = "ClipGift - YouTube clip creator"
authors = ["kyohei"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clipgift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
