name: SNS 自動投稿

on:
  # 【2026-05-10 解禁】v3 連載ストーリー設計 + クロスレビュー完了 → cron 自動投稿開始。
  # 各 cron は target 時刻の 15 分前を指定し、ジョブ内で 0〜30 分ランダム sleep するので
  # 結果的に target ± 15 分のいずれかで投稿される（X 等のボット判定対策で時刻を毎回ぶらすため）。
  schedule:
    # JST 8:45 平日 = UTC 23:45 日〜木 → 投稿は 9:00 ± 15 分
    - cron: '45 23 * * 0-4'
    # JST 18:45 平日 = UTC 9:45 月〜金 → 投稿は 19:00 ± 15 分
    - cron: '45 9 * * 1-5'
    # JST 10:45 土日 = UTC 1:45 土日 → 投稿は 11:00 ± 15 分
    - cron: '45 1 * * 6,0'
    # JST 20:45 土日 = UTC 11:45 土日 → 投稿は 21:00 ± 15 分
    - cron: '45 11 * * 6,0'

  workflow_dispatch:
    inputs:
      schedule_name:
        description: 'スケジュール名（schedule.yaml の name）'
        required: true
        type: choice
        default: weekday_morning
        options:
          - weekday_morning
          - weekday_evening
          - weekend_morning
          - weekend_evening
          - note_announce
          - launch_day
      note_url:
        description: 'note URL（note_announce 時のみ）'
        required: false
        type: string
      note_title:
        description: 'note タイトル（note_announce 時のみ）'
        required: false
        type: string
      note_summary:
        description: 'note 要約（note_announce 時のみ）'
        required: false
        type: string
      booth_url:
        description: 'BOOTH URL（launch_day 等で使用）'
        required: false
        type: string
      dry_run:
        description: 'ドライランモード（実投稿しない）'
        required: false
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r sns_automation/requirements.txt

      - name: Verify required secrets
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          # 必須 Secrets が未設定なら早期にわかりやすく失敗させる
          # （GitHub Settings → Secrets and variables → Actions で登録する）
          missing=()
          for name in THREADS_ACCESS_TOKEN THREADS_USER_ID X_CONSUMER_KEY X_CONSUMER_SECRET X_ACCESS_TOKEN X_ACCESS_TOKEN_SECRET BLUESKY_HANDLE BLUESKY_APP_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::❌ 必須 Secrets が未登録です: ${missing[*]}"
            echo "::error::GitHub リポジトリ → Settings → Secrets and variables → Actions で登録してください"
            echo "::error::再登録手順: docs/SNS_SECRETS_SETUP.md（または README）参照"
            exit 1
          fi
          echo "✅ 必須 Secrets はすべて登録されています"

      - name: Resolve schedule name (cron path)
        id: resolve
        run: |
          # cron 経由なら GITHUB_EVENT_NAME=schedule で、cron 文字列から判定
          # workflow_dispatch なら inputs.schedule_name を使用
          # ※ cron は target 時刻の 15 分前を指定（前後 15 分ジッター後に target になる）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.schedule_name }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "45 23 * * 0-4") echo "name=weekday_morning" >> "$GITHUB_OUTPUT" ;;
              "45 9 * * 1-5")  echo "name=weekday_evening" >> "$GITHUB_OUTPUT" ;;
              "45 1 * * 6,0")  echo "name=weekend_morning" >> "$GITHUB_OUTPUT" ;;
              "45 11 * * 6,0") echo "name=weekend_evening" >> "$GITHUB_OUTPUT" ;;
              *) echo "name=weekday_morning" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Random jitter (target ± 15 min)
        if: github.event_name == 'schedule'
        run: |
          # X 等のボット判定回避のため、毎回投稿時刻をランダムにずらす。
          # cron は target 時刻の 15 分前なので、ここで 0〜1800 秒の間に
          # 待機すると結果的に target ± 15 分のどこかで投稿される。
          JITTER=$((RANDOM % 1800))
          echo "投稿まで ${JITTER} 秒待機します（${JITTER} / 1800 秒）"
          sleep "$JITTER"

      - name: Run poster
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          ARGS="--schedule ${{ steps.resolve.outputs.name }}"
          if [ "${{ steps.resolve.outputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.note_url }}" ]; then
            ARGS="$ARGS --var url=${{ inputs.note_url }}"
          fi
          if [ -n "${{ inputs.note_title }}" ]; then
            ARGS="$ARGS --var title=${{ inputs.note_title }}"
          fi
          if [ -n "${{ inputs.note_summary }}" ]; then
            ARGS="$ARGS --var summary=${{ inputs.note_summary }}"
          fi
          if [ -n "${{ inputs.booth_url }}" ]; then
            ARGS="$ARGS --var booth_url=${{ inputs.booth_url }}"
          fi
          python -m sns_automation.poster $ARGS
